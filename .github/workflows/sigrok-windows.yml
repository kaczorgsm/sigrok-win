# .github/workflows/sigrok-windows.yml
#
# Buduje sigrok-cli + PulseView (instalatory NSIS, 64-bit) z libsigrok z mastera
# (albo z Twojego forka / gałęzi) przez MXE, według sigrok-util/cross-compile/mingw.
#
# Pierwszy przebieg: kilka godzin (budowa MXE z Qt5 + boost).
# Kolejne: ~30-60 min (MXE z cache).
# Uwaga: GitHub usuwa cache nieużywany przez 7 dni -> wtedy MXE buduje się od nowa.

name: sigrok Windows build

on:
  workflow_dispatch:
    inputs:
      libsigrok_repo:
        description: 'Repo libsigrok (URL)'
        default: 'https://github.com/sigrokproject/libsigrok'
      libsigrok_branch:
        description: 'Gałąź libsigrok'
        default: 'master'
      mxe_ref:
        description: 'Commit/gałąź MXE (gdy patche sigroka się nie nakładają - przypnij starszy commit)'
        default: 'master'

env:
  MXE_TARGET: x86_64-w64-mingw32.static.posix
  MXE_PKGS: >-
    gcc glib libzip libusb1 libftdi1 hidapi glibmm qtbase qtimageformats
    qtsvg qttranslations boost check gendef libieee1284
  CACHE_VER: v1   # zmień na v2 itd., żeby wymusić przebudowę MXE

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355   # limit GitHuba to 6 h na job

    steps:
      - name: Zwolnij miejsce na dysku
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Zależności hosta (MXE + sigrok)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint bash bison bzip2 flex g++ g++-multilib \
            gettext git gperf intltool libc6-dev-i386 libgdk-pixbuf2.0-dev \
            libltdl-dev libgl-dev libpcre3-dev libssl-dev libtool-bin \
            libxml-parser-perl lzip make openssl p7zip-full patch perl \
            python3 python3-mako python3-pkg-resources python-is-python3 \
            ruby sed sqlite3 unzip wget xz-utils cmake pkg-config \
            sdcc nsis doxygen asciidoctor

      - name: Pobierz sigrok-util
        run: git clone --depth=1 https://github.com/sigrokproject/sigrok-util.git sigrok-util

      - name: Przywróć MXE z cache
        id: mxe-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/mxe-git
          key: mxe-${{ env.CACHE_VER }}-${{ env.MXE_TARGET }}-${{ inputs.mxe_ref }}-${{ hashFiles('sigrok-util/cross-compile/mingw/*.patch') }}

      - name: Zbuduj MXE (tylko gdy brak cache)
        if: steps.mxe-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/mxe/mxe.git ~/mxe-git
          cd ~/mxe-git
          git checkout "${{ inputs.mxe_ref }}"
          patch -p1 < "$GITHUB_WORKSPACE/sigrok-util/cross-compile/mingw/mxe_fixes.patch"
          patch -p1 < "$GITHUB_WORKSPACE/sigrok-util/cross-compile/mingw/libusb1_upgrade.patch"
          make MXE_TARGETS="$MXE_TARGET" \
               MXE_PLUGIN_DIRS=plugins/examples/qt5-freeze \
               JOBS=4 -j 2 \
               $MXE_PKGS \
               qtbase_CONFIGURE_OPTS='-no-sql-mysql'
          # odchudzenie przed zapisem do cache
          rm -rf pkg .ccache log tmp-*

      - name: Zapisz MXE do cache (od razu, nawet jeśli sigrok się potem wysypie)
        if: steps.mxe-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/mxe-git
          key: ${{ steps.mxe-cache.outputs.cache-primary-key }}

      - name: Przygotuj skrypt sigrok-cross-mingw
        working-directory: sigrok-util/cross-compile/mingw
        run: |
          S=sigrok-cross-mingw
          sed -i 's|^TARGET=.*|TARGET="x86_64"|'                          $S
          sed -i 's|^REPO_BASE=.*|REPO_BASE="https://github.com/sigrokproject"|' $S
          sed -i 's|^PARALLEL=.*|PARALLEL="-j 4"|'                        $S
          # libsigrok z wybranego repo/gałęzi (tylko libsigrok, nie libsigrokdecode)
          sed -i "s|\$GIT_CLONE \$REPO_BASE/libsigrok\$|git clone --depth=1 -b ${{ inputs.libsigrok_branch }} ${{ inputs.libsigrok_repo }} libsigrok|" $S
          echo "---- kontrola podmian ----"
          grep -nE '^(TARGET|REPO_BASE|PARALLEL)=|libsigrok( |$)' $S
          grep -q "${{ inputs.libsigrok_repo }}" $S || { echo "Podmiana repo libsigrok NIE zadziałała"; exit 1; }

      - name: Zbuduj sigrok (libsigrok, sigrok-cli, PulseView)
        id: sigrok
        continue-on-error: true   # jak PulseView padnie, i tak zbierzemy sigrok-cli
        working-directory: sigrok-util/cross-compile/mingw
        run: |
          set -o pipefail
          ./sigrok-cross-mingw 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Zbierz wyniki
        run: |
          mkdir -p dist
          find "$GITHUB_WORKSPACE/sigrok-util" "$HOME" -maxdepth 6 -iname '*installer*.exe' \
               -exec cp -v {} dist/ \; || true
          P=$(ls -d "$HOME"/sr_mingw_release_64 2>/dev/null || true)
          if [ -n "$P" ]; then
            (cd "$P" && 7z a "$GITHUB_WORKSPACE/dist/sr_mingw_release_64.7z" bin share/sigrok-firmware >/dev/null)
          fi
          ls -la dist
          ls dist/*sigrok-cli*.exe >/dev/null 2>&1 || { echo "Brak instalatora sigrok-cli"; exit 1; }

      - name: Artefakt - instalatory
        uses: actions/upload-artifact@v4
        with:
          name: sigrok-windows-x64
          path: dist/

      - name: Artefakt - log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
